<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WoT Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">WORLD OF TANKS</p>
        <h1>WoT Database</h1>
        <p class="subtitle">Baza danych kont odczytanych przez LZT WoT Reader.</p>
      </div>
      <span class="status">● ONLINE</span>
    </header>

    <section class="search">
      <input id="search" type="text" placeholder="Wpisz ID ogłoszenia..." autocomplete="off">
      <button id="searchBtn">Szukaj</button>
    </section>

    <section id="message" class="message">Wpisz ID i kliknij „Szukaj”.</section>
    <section id="result" class="hidden"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
